[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "asistencia_superior"
version = "0.0.1"
description = "Predicción de la asistencia actual al nivel superior en jóvenes de 18 a 24 años con secundario completo, a partir de los microdatos de la EPH (INDEC)."
authors = [
  { name = "Liliana Elizabeth Iñigo" },
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = "~=3.12.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]


[tool.ruff]
line-length = 99
src = ["asistencia_superior"]
include = ["pyproject.toml", "asistencia_superior/**/*.py"]
extend-exclude = [".pixi"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["asistencia_superior"]
force-sort-within-sections = true

